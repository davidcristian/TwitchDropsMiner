name: Build

on:
  push:
    branches:
      - "master"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A run on master is not cancelled once it starts: its release job could stop after it deletes the pre-release
# and before it creates the new one. A newer run on master waits instead.
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{github.ref != 'refs/heads/master'}}

env:
  # The checks run on the oldest Python the app supports, and on Linux also on the Python of the builds. Each
  # PyInstaller build bundles its Python and OpenSSL, so it uses a version for which python.org still publishes
  # Windows and macOS builds.
  PYTHON_VERSION: "3.10"
  BUILD_PYTHON_VERSION: "3.14"
  USE_UPX: false

jobs:
  validate:
    name: Validate (${{matrix.os}}, ${{matrix.python}})
    # Each entry names the variable above that sets its Python. A new entry can set `required: false` until it has
    # passed once: a failure of an entry that is not required does not fail the workflow.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: PYTHON_VERSION
            required: true
          - os: ubuntu-latest
            python: BUILD_PYTHON_VERSION
            required: true
          - os: windows-latest
            python: PYTHON_VERSION
            required: true
          - os: macos-latest
            python: PYTHON_VERSION
            required: true
          - os: windows-latest
            python: BUILD_PYTHON_VERSION
            required: true
          - os: macos-latest
            python: BUILD_PYTHON_VERSION
            required: true
    runs-on: ${{matrix.os}}
    continue-on-error: ${{!matrix.required}}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{env[matrix.python]}}

      - name: Install the check tools and the app's packages
        run: python -m pip install -c constraints.txt -r requirements-dev.txt

      # requirements-dev.txt installs `just` from rust-just, a build by another person, for developers. CI runs the
      # official release of the same version instead, checked against the hashes in that release's SHA256SUMS.
      - name: Install the official just release
        shell: bash
        run: |
          python -m pip uninstall --yes rust-just
          version="$(sed -n 's/^rust-just==//p' requirements-dev.txt | tr -d '\r')"
          check=(sha256sum -c -)
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)
              asset="just-${version}-x86_64-unknown-linux-musl.tar.gz"
              sha256=4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
              ;;
            macOS-ARM64)
              asset="just-${version}-aarch64-apple-darwin.tar.gz"
              sha256=50ae3e996c974a0bf32ea7d10f495070df33f1b43e0616b2769e3d4821ed8f48
              check=(shasum -a 256 -c -)
              ;;
            Windows-X64)
              asset="just-${version}-x86_64-pc-windows-msvc.zip"
              sha256=759f16fb7aa17c5c8b9594b6d4a8c1a6630dfd042cf2b3ff84841454d3d188dc
              ;;
            *)
              echo "No just release is set for ${RUNNER_OS}-${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          mkdir "${RUNNER_TEMP}/just"
          cd "${RUNNER_TEMP}/just"
          curl -fsSL "https://github.com/casey/just/releases/download/${version}/${asset}" -o "${asset}"
          echo "${sha256}  ${asset}" | "${check[@]}"
          python -c 'import shutil, sys; shutil.unpack_archive(sys.argv[1])' "${asset}"
          ./just --version
          echo "${RUNNER_TEMP}/just" >> "${GITHUB_PATH}"

      - name: Run the checks
        run: just check

  windows:
    name: Windows
    runs-on: windows-latest
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up variables
        id: vars
        run: |
          Add-Content $env:GITHUB_OUTPUT "sha_short=$(git rev-parse --short HEAD)"

      - name: Append git revision to project version
        run: |
          (Get-Content version.py) `
          -Replace '^__version__\s*=\s*"[^"]+', "`$0.${{steps.vars.outputs.sha_short}}" |`
          Out-File version.py

      # Ensure Python version
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{env.BUILD_PYTHON_VERSION}}

      - name: Install project dependencies
        run: |
          python3 -m pip install -c constraints.txt pip wheel
          python3 -m pip install -c constraints.txt --build-constraint constraints.txt -r requirements.txt

      # TODO: Consider using https://github.com/crazy-max/ghaction-upx
      # or some other way of keeping the download link up to date in the future
      - name: Install UPX
        if: env.USE_UPX == 'true'
        run: |
          Invoke-WebRequest -Uri https://github.com/upx/upx/releases/download/v5.0.2/upx-5.0.2-win64.zip -OutFile (Join-Path $env:Temp upx.zip)
          Expand-Archive -LiteralPath (Join-Path $env:Temp upx.zip) -DestinationPath $env:Temp
          Move-Item -Path (Join-Path $env:Temp upx-*) -Destination (Join-Path $env:Temp upx)
          Add-Content $env:GITHUB_PATH (Join-Path $env:Temp upx)

      - name: Install PyInstaller
        run: |
          python3 -m pip install -c constraints.txt --build-constraint constraints.txt pyinstaller

      - name: Check that pip installed only the versions in constraints.txt
        run: |
          python3 scripts/installcheck.py

      - name: Create portable executable
        run: |
          pyinstaller build.spec

      - name: Create release folder
        run: |
          $FolderName = 'Twitch Drops Miner'
          New-Item $FolderName -ItemType Directory
          Copy-Item dist\*.exe $FolderName
          Copy-Item manual.txt $FolderName
          Copy-Item LICENSE, LICENSE.MIT $FolderName
          Compress-Archive -Path $FolderName -DestinationPath Twitch.Drops.Miner.Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.Windows
          path: Twitch.Drops.Miner.Windows.zip

  macos:
    name: macOS
    runs-on: macos-latest
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Append git revision to project version
        run: |
          sed -i '' -E "s/^(__version__[[:space:]]*=[[:space:]]*\"[^\"]+)/\1.${{steps.vars.outputs.sha_short}}/" version.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{env.BUILD_PYTHON_VERSION}}

      # The runner's Python has packages of its own, such as certifi at a version that changes with the runner image.
      # The build installs into a new virtual environment, so installcheck reads only the packages that pip installs.
      - name: Create the build environment
        run: |
          python3 -m venv "$RUNNER_TEMP/build-venv"
          echo "$RUNNER_TEMP/build-venv/bin" >> "$GITHUB_PATH"

      - name: Install project dependencies
        run: |
          python3 -m pip install -c constraints.txt pip wheel
          python3 -m pip install -c constraints.txt --build-constraint constraints.txt -r requirements.txt

      - name: Install PyInstaller
        run: |
          python3 -m pip install -c constraints.txt --build-constraint constraints.txt pyinstaller

      - name: Check that pip installed only the versions in constraints.txt
        run: |
          python3 scripts/installcheck.py

      - name: Create portable executable
        run: |
          pyinstaller build.spec --noconfirm

      - name: Create release folder and Zip
        run: |
          FOLDER="Twitch Drops Miner"
          mkdir -p "$FOLDER"
          cp -r "dist/Twitch Drops Miner.app" "$FOLDER/"
          cp manual.txt LICENSE LICENSE.MIT "$FOLDER/"
          zip -r Twitch.Drops.Miner.MacOS.zip "$FOLDER"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.MacOS
          path: Twitch.Drops.Miner.MacOS.zip

  linux-pyinstaller:
    name: Linux (PyInstaller) (${{matrix.arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{matrix.runner}}
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Append git revision to project version
        run: |
          sed -ri "s/^__version__\s*=\s*\"[^\"]+/\0.${{steps.vars.outputs.sha_short}}/" version.py

      # Ensure Python version
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{env.BUILD_PYTHON_VERSION}}

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install libgirepository1.0-dev gir1.2-ayatanaappindicator3-0.1 libayatana-appindicator3-1 python3-tk

      - name: Install project dependencies
        run: |
          python3 -m pip install -c constraints.txt pip wheel
          python3 -m pip install -c constraints.txt --build-constraint constraints.txt -r requirements.txt

      - name: Install PyInstaller
        run: |
          python3 -m pip install -c constraints.txt --build-constraint constraints.txt pyinstaller

      - name: Check that pip installed only the versions in constraints.txt
        run: |
          python3 scripts/installcheck.py

      # NOTE: Remove this step if/once libxft gets updated to 2.3.5 or newer on Ubuntu 22.04, which currently has 2.3.4.
      - name: Build a recent version of libXft
        run: |
          mkdir -p /tmp/libXft
          cd /tmp/libXft
          curl -fL https://xorg.freedesktop.org/releases/individual/lib/libXft-2.3.9.tar.xz -o libXft.tar.xz
          echo "60a25b78945ed6932635b3bb1899a517d31df7456e69867ffba27f89ff3976f5  libXft.tar.xz" | sha256sum -c -
          tar xvf libXft.tar.xz
          cd libXft-*
          ./configure --prefix=/tmp/libXft --sysconfdir=/etc --disable-static
          make
          make install-strip

      - name: Create portable executable
        run: |
          LD_LIBRARY_PATH=/tmp/libXft/lib xvfb-run --auto-servernum pyinstaller build.spec

      - name: Show PyInstaller warnings
        run: |
          cat build/build/warn-build.txt || true

      - name: Create release folder
        run: |
          folder='Twitch Drops Miner'
          mkdir "${folder}"
          cp manual.txt LICENSE LICENSE.MIT dist/* "${folder}"
          7z a 'Twitch.Drops.Miner.Linux.PyInstaller-${{matrix.arch}}.zip' "${folder}"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.Linux.PyInstaller-${{matrix.arch}}
          path: Twitch.Drops.Miner.Linux.PyInstaller-${{matrix.arch}}.zip

  linux-appimage:
    name: Linux (AppImage) (${{matrix.arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{matrix.runner}}
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up variables
        id: vars
        run: |
          echo "app_version=$(python3 -c 'from version import __version__ as v; print(v)')" >> "${GITHUB_OUTPUT}"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Append git revision to project version
        run: |
          sed -ri "s/^__version__\s*=\s*\"[^\"]+/\0.${{steps.vars.outputs.sha_short}}/" version.py

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install libgirepository1.0-dev gir1.2-ayatanaappindicator3-0.1 libayatana-appindicator3-1

      - name: Install appimage-builder
        run: |
          python3 -m pip install -c constraints.txt --upgrade pip
          python3 -m pip install -c constraints.txt wheel
          python3 -m pip install -c constraints.txt setuptools setuptools_scm
          # TODO: Switch to a stable release if/when a version newer than 1.1.0 is released.
          python3 -m pip install -c constraints.txt --build-constraint constraints.txt git+https://github.com/AppImageCrafters/appimage-builder.git@1a8794d3c89f288fbd82b9accd7c0b74611147d5

      # The job runs as a user without root, so pip installs each package into the user's site folder, and Ubuntu's own
      # packages stay in another one. constraints.txt does not list appimage-builder, which comes from a git commit.
      - name: Check that pip installed only the versions in constraints.txt
        run: |
          python3 scripts/installcheck.py --skip appimage-builder --folder "$(python3 -m site --user-site)"

      - name: Create AppImage
        env:
          ARCH: ${{matrix.arch}}
          ARCH_APT: ${{matrix.arch == 'x86_64' && 'amd64' || 'arm64'}}
          APP_VERSION: ${{steps.vars.outputs.app_version}}.${{steps.vars.outputs.sha_short}}
          PYTHON_VERSION: ${{env.PYTHON_VERSION}}
        run: |
          appimage-builder --recipe appimage/AppImageBuilder.yml

      # The recipe puts the checked runtime and AppRun where appimage-builder looks for them. This step fails when
      # the AppImage contains other files, such as after an update of appimage-builder moves those paths.
      - name: Check that the AppImage contains the checked runtime and AppRun
        run: |
          runtime=appimage-build/prime/runtime-${{matrix.arch}}
          cmp -n "$(stat -c %s "${runtime}")" "${runtime}" Twitch.Drops.Miner-${{matrix.arch}}.AppImage
          cmp appimage-build/AppRun/v2.0.0/AppRun-Release-${{matrix.arch}} AppDir/AppRun
          cmp appimage-build/AppRun/v2.0.0/libapprun_hooks-Release-${{matrix.arch}}.so AppDir/lib/${{matrix.arch}}/libapprun_hooks.so

      # The recipe installs requirements.txt into this folder, which the AppImage adds to PYTHONPATH.
      - name: Check that the AppImage contains only the versions in constraints.txt
        run: |
          python3 scripts/installcheck.py --folder AppDir/usr/lib/python3.10/site-packages

      - name: Create release folder
        run: |
          folder='Twitch Drops Miner'
          mkdir "${folder}"
          cp *.AppImage manual.txt LICENSE LICENSE.MIT "${folder}"
          7z a 'Twitch.Drops.Miner.Linux.AppImage-${{matrix.arch}}.zip' "${folder}"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.Linux.AppImage-${{matrix.arch}}
          path: Twitch.Drops.Miner.Linux.AppImage-${{matrix.arch}}.zip

  update_releases_page:
    name: Upload builds to Releases
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    concurrency:
      group: dev-build
      cancel-in-progress: false
    needs:
      - windows
      - linux-pyinstaller
      - linux-appimage
      - macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Set up variables
        id: vars
        run: |
          echo "date_now=$(date --rfc-3339=seconds)" >> "${GITHUB_OUTPUT}"

      - name: Download build artifacts from previous jobs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Delete the existing pre-release (if present)
        run: |
          TAG=dev-build
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
          else
            echo "No $TAG release; skipping delete"
          fi
        env:
          GITHUB_TOKEN: ${{github.token}}

      - name: Create a new dev build release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: artifacts/*/*
          commit: ${{github.sha}}
          body: |
            **This is an automatically generated in-development pre-release version of the application, that includes the latest master branch changes.**
            **⚠️ This build is not stable and may end up terminating with a fatal error. ⚠️**
            **Use at your own risk.**

            - Last build date: `${{steps.vars.outputs.date_now}}`
            - Reference commit: ${{github.sha}}
          name: Development build
          prerelease: true
          removeArtifacts: true
          tag: dev-build
