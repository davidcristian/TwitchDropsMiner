# One hook runs `just check` before each commit, and two hooks check the commit message.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      - id: just-check
        name: just check
        entry: just check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: commitlint
        name: commit message rules in AGENTS.md
        entry: python scripts/commitlint.py
        language: python
        stages: [commit-msg]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, test, refactor, perf, build, ci, chore, revert]
